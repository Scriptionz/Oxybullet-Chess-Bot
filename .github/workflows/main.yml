name: Oxydan Lichess Bot

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
on:
  workflow_dispatch: # Manuel başlatma
  schedule:
    # ÇÖZÜM: Her 5 saatte bir çalışacak şekilde güncellendi (00:00, 05:00, 10:00 vs.)
    - cron: '0 */5 * * *' 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cerebellum Kitabini Indir ve Kur
        run: |
          echo "📚 Devasa açılış kitabı indiriliyor..."
          curl -L "https://github.com/Scriptionz/Oxybullet-Chess-Bot/releases/download/v1_Book/Cerebellum3Merge.bin" -o book.bin
          
          if [ ! -f book.bin ]; then
            echo "❌ HATA: Kitap dosyası indirilemedi! Linki kontrol edin."
            exit 1
          fi
          echo "✅ Kitap hazır: $(ls -lh book.bin)"

      - name: Motoru Derle
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang
          cd src
          clang -O3 -std=gnu11 -Wall -Wextra -DNDEBUG -flto -DUSE_NNUE=0 -march=native *.c pyrrhic/tbprobe.c -lpthread -lm -o Ethereal
          chmod +x Ethereal
          echo "Motor basariyla derlendi."
          cd ..

      - name: Kutuphaneleri Kur
        run: |
          pip install -r requirements.txt

      - name: Motor Test (UCI Testi)
        run: |
          chmod +x ./src/Ethereal
          echo "uci" | ./src/Ethereal | grep "uciok" || (echo "MOTOR CALISMIYOR!" && exit 1)

      - name: Botu Baslat
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          sed -i "s/\$LICHESS_TOKEN/$LICHESS_TOKEN/g" config.yml || echo "Config hatasi!"
          python -u lichess-bot.py
