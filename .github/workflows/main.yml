name: Oxydan Lichess Bot

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
on:
  workflow_dispatch: # Manuel başlatma
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik başlar

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4
        # LFS: true satırını sildik, artık ihtiyacımız yok

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cerebellum Kitabini Indir ve Kur
        run: |
          echo "📚 Devasa açılış kitabı indiriliyor..."
          # Release linkini kullanarak ZIP dosyasını çekiyoruz
          curl -L "https://github.com/Scriptionz/Oxybullet-Chess-Bot/releases/download/v1_Book/Cerebellum3Merge.zip" -o book.zip
          
          echo "📂 ZIP'ten çıkarılıyor..."
          unzip book.zip
          
          # Dosya adını kodun tanıması için 'book.bin' yapıyoruz
          mv Cerebellum3Merge.bin book.bin
          
          echo "✅ Kitap hazır: $(ls -lh book.bin)"

      - name: Motoru Derle
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang
          cd src
          clang -O3 -std=gnu11 -Wall -Wextra -DNDEBUG -flto -DUSE_NNUE=0 -march=native *.c pyrrhic/tbprobe.c -lpthread -lm -o Ethereal
          chmod +x Ethereal
          echo "Motor basariyla derlendi."
          cd ..

      - name: Kutuphaneleri Kur
        run: |
          pip install -r requirements.txt

      - name: Motor Test (UCI Testi)
        run: |
          chmod +x ./src/Ethereal
          echo "uci" | ./src/Ethereal | grep "uciok" || (echo "MOTOR CALISMIYOR!" && exit 1)

      - name: Botu Baslat
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          # Config dosyasındaki token yer tutucusunu güncelle
          sed -i "s/\$LICHESS_TOKEN/$LICHESS_TOKEN/g" config.yml || echo "Config hatasi!"
          
          # Botu başlat
          python -u lichess-bot.py
