token: "$LICHESS_TOKEN"
url: "https://lichess.org/"

engine:
  dir: "./src/"
  name: "Ethereal"
  protocol: "uci"
  uci_options:
    Threads: 2            # Performans için 2 çekirdek
    Hash: 512             # Hızlı tablo erişimi
    # KRİTİK AYARLAR:
    MoveOverhead: 100     # Botun hamleyi iletmek için bıraktığı pay (0.1 sn)
    Ponder: true          # Rakip düşünürken hesapla (Anında cevap için şart)
    Slow Mover: 10        # Ethereal'a "vaktin olsa bile harcama" talimatı (0-100 arası, 10 çok hızlıdır)
    SyzygyPath: "./syzygy"
    SyzygyProbeDepth: 1

# --- SOSYAL MESAJLAR ---
chat:
  welcome: "🏎️ Oxybullet 2 Speed Demon! Playing everything like Bullet. Don't blink!"
  goodbye: "GG! Still too fast, even in classical? ;)"

# --- TÜM ZAMAN TEMPOLARI AÇIK ---
challenge_policy:
  accept_bot: true
  accept_human: true
  rated: true             
  time_controls:
    - ultrabullet         # 15s, 30s
    - bullet              # 1dk, 2dk
    - blitz               # 3dk, 5dk
    - rapid               # 10dk+
    - classical           # 30dk+
  min_time: 15            # Minimum HyperBullet
  max_time: 2000         # Maksimum 3 saat (Tüm zamanlar dahil)

# --- SÜREKLİ MAÇ ARAYIŞI ---
matchmaking:
  allow_feed: true
  challenge_interval: 60  # 10 saniyede bir yeni kurban ara
  challenge_timeout: 15
  max_games: 2            # Kalite için tek maç odaklı
  
  opponent_min_rating: 1500      
  opponent_max_rating: 4000      
  opponent_rating_difference: 700 

  time_controls:
    - "0.25+0"
    - "0.5+0"             
    - "1+0"               
    - "3+0"
    - "5+0"
    - "10+0"
    - "15+10"
    - "30+0"              # Artık klasik maçlara da kendi meydan okuyacak
    
  challenge_bots: true
  challenge_humans: false  
  selection: "random"
